{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "css/output.css" %}">
    <title>Document</title>
</head>
<body>
    <h1>Log in </h1>
    <div>
        {% if messages %}
          {% for message in messages %}
            <div class= "px-2 py-1 {% if message.tags == 'success' %}bg-green-500 {% endif %}">{{ message }}</div>
          {% endfor %}
        {% endif %}
       
    </div> 
    <form method="POST">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit" class="border border-blue-700 bg-blue-500 text-white rounded-lg px-3 py-1" >Sign Up</button>
    </form>
</body>
</html>
