{% extends "base.html" %}
{% block content %}

<div class="w-1/4 mx-auto my-10">
  <h1 class="text-5xl font-mono font-semibold my-10 text-center text-blue-800">Log in </h1>
    {% if messages %}
      {% for message in messages %}
        <div class= "px-2 py-1 {% if message.tags == 'success' %}bg-green-500 {% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}
   

  <form method="POST">
      {% csrf_token %}
      {{form.as_p}}
      <button type="submit" class="border border-blue-700 bg-blue-500 text-white rounded-lg px-3 py-1" >Sign Up</button>
  </form>
  <p class="mt-5"><a href="{% url "password_reset" %}" class="text-xs text-red-800 underline">Forgot Password?</a></p>
</div> 
{% endblock content %}
