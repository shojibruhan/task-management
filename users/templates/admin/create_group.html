{% extends "admin/dashboard.html" %}
{% block content %}

    <div class="w-1/2 mx-auto my-8 flex flex-col">
        <ul>
            {% for message in messages %} 
                <li class="bg-green-500 px-2 py-1 mb-5 text-white"> {{message}} </li>
            {% endfor %}
        </ul>

        <form method="POST">
            {% csrf_token %}
            <div class="mt-5 mb-5">{{form}}</div>
            <div>
                <button class="mt-5 px-3 py-1 text-white bg-blue-500 rounded-md" type="submit">Create Group</button>
            </div>
        </form>
    </div>

{% endblock content %}
