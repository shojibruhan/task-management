{% extends "admin/dashboard.html" %}
{% block content %}

    <div class="w-1/2 mx-auto my-8 flex flex-col">
        <ul>
            {% for message in messages %}
                <li class="bg-green-500 px-2 py-1 text-white "> {{message}} </li>
            {% endfor %}
        </ul>

        <form method="POST">
            {% csrf_token %}
            {{form}}
            <div>
                <button class="mt-5 px-3 py-1 text-white bg-blue-500 rounded-md" type="submit">Assigned Role</button>
            </div>
        </form>
    </div>

{% endblock content %}
